[workspace]
members = ["programs/*"]
resolver = "2"

[features]
seeds = false
skip-lint = false

[programs.localnet]
interval = "6GfKzK6QZ3xMaRgmvriLwqtSAeMKn9vPvwUwx1z971TY"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 10000

[scripts]
test = "NODE_PATH=../frontend/node_modules node --test tests/*.cjs"
